version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: f1-postgres
    environment:
      POSTGRES_DB: f1db
      POSTGRES_USER: f1user
      POSTGRES_PASSWORD: f1pass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1user -d f1db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - f1-network

volumes:
  postgres_data:
    driver: local

networks:
  f1-network:
    driver: bridge
